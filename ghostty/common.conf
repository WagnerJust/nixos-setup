# Ghostty settings shared by every machine.
#
# Pulled in from each host's own config with `config-file`. Ghostty loads an
# included file *after* the file that references it, so whatever is in here
# WINS over the including config — that is why nothing host-specific lives
# here. Theme, font size, and platform-only keys stay in the per-host config:
#
#   NixOS  ~/.config/ghostty/config   generated by home-manager (home.nix)
#          theme = noctalia (Noctalia's apply.sh no-ops when it sees this),
#          font-size = 11
#
#   macOS  ~/Library/Application Support/com.mitchellh.ghostty/config
#          theme = Andromeda, font-size = 18, the macos-* block, fullscreen
#
# On NixOS this file is referenced by its /nix/store path, so it must be
# git-tracked for the flake to see it, and edits need a `nixos-rebuild switch`
# to take effect. On macOS it is read straight out of the working copy, so a
# `git pull` plus ctrl+shift+r is enough.

# --- General & window ---
working-directory = home
shell-integration = zsh
shell-integration-features = ssh-terminfo,ssh-env
scrollback-limit = 5000000
clipboard-read = allow
clipboard-write = allow
copy-on-select = true
mouse-shift-capture = false

# GTK-only, so this is inert on macOS. Kept here rather than in the NixOS
# config because it is a preference, not a hardware fact.
window-subtitle = working-directory

# --- Appearance ---
# font-size and theme are deliberately absent — see the header.
font-family = "Hack Nerd Font Mono"
cursor-style = block

# --- Zellij-style keybindings ---

# Direct pane navigation, no leader key.
keybind = ctrl+h=goto_split:left
keybind = ctrl+j=goto_split:down
keybind = ctrl+k=goto_split:up
keybind = ctrl+l=goto_split:right

# General actions.
keybind = ctrl+q=quit

# Pane mode (leader: ctrl+p) — emulates Zellij's pane mode.
keybind = ctrl+p>r=new_split:right
keybind = ctrl+p>d=new_split:down
keybind = ctrl+p>n=new_split:right
keybind = ctrl+p>p=goto_split:previous
keybind = ctrl+p>f=toggle_split_zoom
keybind = ctrl+p>x=close_surface
keybind = ctrl+p>==equalize_splits
keybind = ctrl+p>q=quit

# Resize mode (leader: ctrl+n) — emulates Zellij's resize mode.
keybind = ctrl+n>h=resize_split:left,80
keybind = ctrl+n>j=resize_split:down,80
keybind = ctrl+n>k=resize_split:up,80
keybind = ctrl+n>l=resize_split:right,80

# Font size mode (leader: ctrl+f) — optional, off by default.
# keybind = ctrl+f>==increase_font_size:1
# keybind = ctrl+f>+=increase_font_size:1
# keybind = ctrl+f>-=decrease_font_size:1
# keybind = ctrl+f>0=reset_font_size

# --- Utility ---
keybind = ctrl+shift+r=reload_config
